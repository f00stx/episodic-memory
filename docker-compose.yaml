# episodic-memory Docker Compose
#
# Runs one RecallEngine HTTP service per agent store.
# Copy .env.example → .env and fill in your paths before running.
#
# Usage:
#   cp .env.example .env
#   # edit .env -- set STORE_PATH and optionally MODEL_CACHE_PATH
#   docker compose up -d
#   curl http://localhost:8099/health
#
# Add more services (one per agent) by duplicating the block below
# with a different STORE_PATH and port mapping.
#
# BGE model note: HF cache uses symlinks inside snapshots/ pointing to ../../blobs/.
# If mounting a pre-downloaded model, mount the full HF cache root
# (e.g. models--BAAI--bge-small-en-v1.5) so relative symlinks resolve.
# EMBEDDING_MODEL should then point at the snapshot subpath inside the container.
#
# Rebuild after code changes:
#   docker compose build && docker compose up -d

services:

  episodic-memory:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: episodic-memory
    ports:
      - "${PORT:-8099}:8099"
    environment:
      # Required: path inside the container to episodes.db + hot_metadata.json
      - STORE_PATH=/store

      # Embedding model -- bge-small is the default (133MB, ~5s load).
      # Set to BAAI/bge-large-en-v1.5 for higher recall quality (~1.3GB, ~30s load).
      # Can be a HuggingFace model ID (auto-downloads on first start) or a local path.
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}

      # Minimum cosine similarity to return a result (0-1).
      # 0.55 is a good starting point for bge-small. Lower = more recalls, noisier.
      - RECALL_THRESHOLD=${RECALL_THRESHOLD:-0.55}

      # Set to "false" to include roleplay/fiction sessions in factual recall.
      - FILTER_ROLEPLAY=${FILTER_ROLEPLAY:-true}

      - PORT=8099

    volumes:
      # Memory store -- directory containing episodes.db + hot_metadata.json.
      # Build this with EpisodicMemoryStore.add() or your encode script.
      - type: bind
        source: ${STORE_PATH:?STORE_PATH must be set in .env}
        target: /store

      # Optional: pre-cached HuggingFace model directory.
      # If unset, the model auto-downloads on first start (needs internet).
      # To use a local cache, set MODEL_CACHE_PATH=~/.cache/huggingface/hub
      # and uncomment the block below:
      #
      # - type: bind
      #   source: ${MODEL_CACHE_PATH}
      #   target: /root/.cache/huggingface/hub
      #   read_only: true

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # model load: ~5s (bge-small) or ~30s (bge-large)
